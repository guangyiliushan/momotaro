# Supply-chain policy (D39). `cargo deny check` runs in CI on every change and
# on a daily schedule, so a new advisory against an already-pinned dependency is
# disclosed without anyone having to remember to look.
#
# One class is only weakly covered, stated here because the sentence above
# cannot. `unsound = "Workspace"` is the default we run, and under it an
# advisory is surfaced when the affected crate is a *direct* dependency of this
# workspace — so `ureq`, `clap`, `tantivy`… would be disclosed, a transitive
# one would not, and a workspace member is never reported at all (it has no
# package source, so it is dropped before scope is even considered).
# `lru 0.16.4` (RUSTSEC-2026-0253, fixed >= 0.18.2, unreachable while tantivy
# pins `^0.16.3`) is transitive — via `tantivy` — so it is silent today;
# `unsound = "all"` is what would surface it, and that run goes red until the
# tantivy upgrade lands. That upgrade is registered as its own task — this is
# the disclosure that covers it until then.

[graph]
# Every target we build for, so a Windows-only or test-only dependency cannot
# hide from the license and advisory checks.
all-features = true

[advisories]
# A yanked crate is not a version anybody can rely on; refuse it rather than
# warning, because the fix is always "move off the yanked version".
yanked = "deny"

# `unsound = "all"` turns the class on for **transitive** dependencies too —
# the default `workspace` scope cannot see one at all, so what we accept has to
# be listed rather than merely silent.
unsound = "all"
# What is accepted, and why: an exemption anybody can read and audit, not a
# blind spot nobody can see.
ignore = [
    # RUSTSEC-2026-0253 (`lru 0.16.4`) — INFO · Unsound, no CVSS. The UB is on
    # a panic path: a key whose `Drop` panics inside `LruCache::pop()` skips
    # `detach()`, leaving a dangling node that a later eviction writes through
    # (UAF, possible double-free). It needs unwinding plus a `catch_unwind`
    # plus a key type that panics on drop; nothing in this workspace has one.
    #
    # Fixed in `lru >= 0.18.2`. Every published tantivy pins `lru ^0.16.3`, so
    # the only route to the fix is tantivy 0.27.0 — which exists on main and in
    # no release. Remove this entry when that lands.
    # This cargo-deny takes `id` + `reason` only (no `expiry`), so the review
    # date lives here and in the register: **re-examine by 2027-01-07**, and
    # immediately if tantivy 0.27.0 is released.
    { id = "RUSTSEC-2026-0253", reason = "panic-path UB in lru (key Drop panics in pop -> skipped detach -> UAF); needs unwinding + catch_unwind + a panicking key, none of which this workspace has. Fixed in lru >= 0.18.2, unreachable: every published tantivy pins ^0.16.3 and 0.27.0 is unreleased. Review by 2027-01-07 or on 0.27.0." },
]
# An ignored advisory that outlives its reason is worse than one that is not
# ignored at all: make the forgetting visible.
unused-ignored-advisory = "warn"

[licenses]
# Permissive licenses only. Anything else needs a deliberate decision recorded
# here, not a surprise in a lockfile.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    # Mozilla's root-certificate bundle as published by the webpki maintainers:
    # a permissive *data* license with no copyleft. It reaches this graph only
    # through rustls-platform-verifier's `cfg(target_arch = "wasm32")` branch
    # (`webpki-root-certs`), which no target this project builds ever compiles —
    # kept in the graph on purpose so cargo-deny keeps auditing it. The runtime
    # trust root is the platform's (`RootCerts::PlatformVerifier`), never this.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# An allowance nobody uses yet is policy (the list is the licences this project
# accepts), not drift, so a never-encountered entry is not worth a warning.
unused-allowed-license = "allow"
# Workspace crates are `publish = false`: internal, so the license check does
# not apply to them (the repo-root LICENSE covers the project itself).
private = { ignore = true }

[bans]
multiple-versions = "warn"
# Duplicates are reported, not denied — a `warn` that nobody can explain is
# drift, so the current set is attributed here. The four this round added all
# come from the ureq TLS stack and are un-unifiable by construction:
#   base64    0.22 (tantivy) vs 0.23 (ureq, ureq-proto)
#   getrandom 0.4 (cc/jobserver) vs 0.2 (ring)
#   syn       3 (11 dependents, `serde_derive` one of them) vs 2
#             (`jni-macros`, an android-only branch)
#   windows-sys 0.52 (`ring` pins ^0.52), a fourth version beside the
#   0.59/0.60/0.61 the workspace already carried
# The `windows_*` target crates, `hashbrown`, `winnow` and `windows-targets`
# were already duplicated before this round.
wildcards = "deny"
# Every crate here depends on its workspace siblings by path, with no version
# to check; `workspace = true` is not a wildcard to be afraid of.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
