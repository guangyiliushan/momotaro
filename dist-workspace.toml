[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# NOTE: .github/workflows/release.yml is dist-OWNED and self-verified — dist
# refuses to plan if the file drifts, so its action refs stay major-tag pins
# (checkout@v6, upload-artifact@v7, download-artifact@v8). The repo's
# 40-char SHA discipline applies to hand-written workflows only; the
# exception lives here because editing the pins breaks `dist plan`.
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
