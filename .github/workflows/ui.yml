name: ui

on:
  push:
    paths:
      - "apps/desktop/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tools/gates.sh"
      - ".github/workflows/ui.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tools/gates.sh"
      - ".github/workflows/ui.yml"

permissions:
  contents: read

jobs:
  test:
    # One leg is the whole contract: the tests under `apps/desktop` and
    # `packages/ui` touch the DOM and `localStorage` only — no filesystem
    # paths, no shell — so a second OS would re-run the same assertions. A
    # matrix is the answer the day one of those becomes untrue.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No `version` input: the action reads `packageManager` from the root
      # `package.json`, so the pin lives in exactly one place.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same gate file the Rust workflow runs: `--only ts` is the step the
      # close-out tier adds after `test`, so the suite a contributor replays
      # locally is the suite this job runs.
      - name: TypeScript tests
        run: bash tools/gates.sh --only ts
