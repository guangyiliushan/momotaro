name: engine

on:
  push:
    # Both keys are required together: `tags-ignore` alone (no `branches`)
    # silently disables branch triggering per the workflow-syntax docs.
    # Tag pushes bypass path filters anyway (a new tag runs the workflow
    # regardless), and release moments belong to release-desktop alone.
    branches:
      - "**"
    tags-ignore:
      - "**"
    paths:
      - "crates/**"
      - "apps/cli/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "deny.toml"
      - "tools/evals/**"
      - ".github/workflows/ci-engine.yml"
  pull_request:
    paths:
      - "crates/**"
      - "apps/cli/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "deny.toml"
      - "tools/evals/**"
      - ".github/workflows/ci-engine.yml"
  schedule:
    # Advisories and yanks land between commits. On a schedule the whole file
    # runs against the default branch, so a dependency that was fine yesterday
    # is disclosed today without anyone having to remember to look.
    - cron: "17 6 * * *"

permissions:
  contents: read

# 8/10 surveyed repos (tokio among them): a new push to the same PR cancels the
# in-flight run. schedule events group by SHA, so nightly runs never cancel
# each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Every gate below is one `--only` of `tools/gates.sh`: the suite a
  # contributor replays locally is the suite CI runs, so the two cannot drift
  # apart. What CI keeps for itself is the *split* — one job per gate, so a
  # red is named, gates run in parallel instead of behind the slowest one, and
  # a clippy fix never re-runs the test suite (ripgrep / tokio / crabnebula
  # all use this shape).
  #
  # fmt and doc are platform-independent: one ubuntu leg. clippy keeps both
  # legs — `#[cfg(windows)]` code only compiles on the windows leg, and the
  # ubuntu leg is the only place `#[cfg(unix)]` code is seen. The two checks
  # the gates script does not own stay in `instruments`: `perf_smoke` and the
  # eval-harness self-tests.
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Node 20 actions are removed from runners; pin 40-char SHAs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: bash tools/gates.sh --only fmt

  clippy:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Clippy
        run: bash tools/gates.sh --only clippy

  doc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Doc
        run: bash tools/gates.sh --only doc

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test
        shell: bash
        run: bash tools/gates.sh --only test
      # TEMPORARY diagnosis aid (remove once the windows test leg is green).
      - name: Surface failing tests (temporary)
        if: failure()
        shell: bash
        run: |
          grep -B 2 -A 14 "panicked at" /tmp/momotaro-gates.log | head -80 | while IFS= read -r line; do
            echo "::error::${line:0:350}"
          done
          grep -E "test result: FAILED" /tmp/momotaro-gates.log | while IFS= read -r line; do
            echo "::error::${line:0:350}"
          done

  deny:
    # Supply chain: licenses, advisories, yanks, sources. A policy file nobody
    # runs is decoration. Runs on every change by design (deny.toml header):
    # a new advisory is disclosed the day it lands, not on the next cron.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # `--locked` is a global flag, so it has to precede the subcommand —
          # which is what the action's two argument inputs are for (the
          # `cargo deny --locked check` spelling). Feature coverage is not a CLI flag in
          # cargo-deny 0.20; it comes from `[graph] all-features = true`.
          arguments: --locked
          command: check

  instruments:
    # The three checks `cargo test` cannot see: the ignored performance smoke, the
    # golden-set guards, and the retrieval golden set. All three lived outside CI, which is
    # how a ranking change could merge green.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the CLI
        run: cargo build --locked -p momotaro-cli
      - name: Performance smoke (1000 files)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p momotaro-run --lib --locked -- --ignored --nocapture perf_smoke
      - name: Golden-set guard tests
        # The guard is the only thing between this job and the repository; it
        # gets a test step of its own so it cannot rot silently.
        run: bash tools/gates.sh --only guards
      - name: Eval harness self-tests
        # The gate wiring (miss accounting, known_miss whitelist, ceilings)
        # is code like any other: a nobody-executed self-test is decoration.
        run: python tools/evals/test_eval_search.py
      - name: Retrieval gate (golden set)
        # Windows runs the same 60-query contract; cross-platform path handling
        # is part of the instrument, not an implementation detail.
        run: bash tools/gates.sh --only golden