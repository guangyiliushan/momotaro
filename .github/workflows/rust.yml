name: rust

on:
  push:
    paths:
      - "crates/**"
      - "apps/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "deny.toml"
      - "tools/evals/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "crates/**"
      - "apps/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "deny.toml"
      - "tools/evals/**"
      - ".github/workflows/rust.yml"
  schedule:
    # Advisories and yanks land between commits. On a schedule the whole file
    # runs against the default branch, so a dependency that was fine yesterday
    # is disclosed today without anyone having to remember to look.
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # Node 20 actions are removed from runners; pin 40-char SHAs on the Node 24 line.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Every gate below is one `--only` of `tools/gates.sh`: the suite a
      # contributor replays locally is the suite this job runs, so the two
      # cannot drift apart. What the job keeps for itself is the *split* —
      # separate steps, so a red is named — and the two checks the script does
      # not own (`perf_smoke`, the eval harness self-tests).
      - name: Format
        run: bash tools/gates.sh --only fmt
      - name: Clippy
        run: bash tools/gates.sh --only clippy
      - name: Doc
        run: bash tools/gates.sh --only doc
      - name: Test
        shell: bash
        run: bash tools/gates.sh --only test
  deny:
    # Supply chain: licenses, advisories, yanks, sources. A policy file nobody
    # runs is decoration.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # `--locked` is a global flag, so it has to precede the subcommand —
          # which is what the action's two argument inputs are for (the
          # `cargo deny --locked check` spelling). Feature coverage is not a CLI flag in
          # cargo-deny 0.20; it comes from `[graph] all-features = true`.
          arguments: --locked
          command: check

  instruments:
    # The three checks `cargo test` cannot see: the ignored performance smoke, the
    # golden-set guards, and the retrieval golden set. All three lived outside CI, which is
    # how a ranking change could merge green.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the CLI
        run: cargo build --locked -p momotaro-cli
      - name: Performance smoke (1000 files)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p momotaro-run --lib --locked -- --ignored --nocapture perf_smoke
      - name: Golden-set guard tests
        # The guard is the only thing between this job and the repository; it
        # gets a test step of its own so it cannot rot silently.
        run: bash tools/gates.sh --only guards
      - name: Eval harness self-tests
        # The gate wiring (miss accounting, known_miss whitelist, ceilings)
        # is code like any other: a nobody-executed self-test is decoration.
        run: python tools/evals/test_eval_search.py
      - name: Retrieval gate (golden set)
        # Windows runs the same 60-query contract; cross-platform path handling
        # is part of the instrument, not an implementation detail.
        run: bash tools/gates.sh --only golden
