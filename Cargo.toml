[workspace]
resolver = "2"
members = [
  "crates/momotaro-contracts",
  "crates/momotaro-store",
  "crates/momotaro-run",
  "crates/momotaro-ingest",
  "crates/momotaro-retrieve",
  "crates/momotaro-llm",
  "crates/momotaro-context",
  "crates/momotaro-verify",
  "apps/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[workspace.dependencies]
momotaro-contracts = { path = "crates/momotaro-contracts" }
momotaro-run = { path = "crates/momotaro-run" }
momotaro-store = { path = "crates/momotaro-store" }
momotaro-ingest = { path = "crates/momotaro-ingest" }
momotaro-retrieve = { path = "crates/momotaro-retrieve" }
momotaro-llm = { path = "crates/momotaro-llm" }
momotaro-context = { path = "crates/momotaro-context" }
momotaro-verify = { path = "crates/momotaro-verify" }
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "0.9"
tantivy = "0.26"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html", "getopts"] }
sha2 = "0.11"
hex = "0.4"
walkdir = "2.5"
unicode-normalization = "0.1"
